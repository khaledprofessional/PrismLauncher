name: HyperMine (Windows MSVC)

# A Windows-only build, kept separate from build.yml so that verifying the HyperMine tab
# costs one runner instead of six. build.yml is left exactly as upstream ships it, so
# syncing the fork stays conflict-free.
#
# Produces a runnable PrismLauncher build of the current branch. Deliberately unsigned:
# there is no signing certificate in a fork, so the artifact will warn on launch.

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/hypermine-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Windows-MSVC
    runs-on: windows-2022

    # Match upstream's build.yml. Without this, `run` steps on Windows default to pwsh,
    # where "$VCPKG_TRIPLET" expands as a PowerShell *variable* -- which does not exist,
    # so it expands to nothing and vcpkg is handed an empty triplet.
    defaults:
      run:
        shell: bash

    env:
      ARTIFACT_NAME: Windows-MSVC-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: Debug
      CMAKE_PRESET: windows_msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: Windows-MSVC
          vcvars-arch: amd64
          qt-version: 6.11.2

      - name: Disable the vcpkg binary cache
        shell: bash
        run: |
          # Upstream's setup points vcpkg's binary cache at a GitHub Packages feed owned by
          # PrismLauncher, authenticated with a token scoped to write packages. Neither
          # exists on a fork, so a cache lookup there can only fail -- and "clear" in the
          # source list also wipes the default. Building from source is slower but needs
          # no secrets.
          echo "VCPKG_BINARY_SOURCES=clear" >> "$GITHUB_ENV"

      # Run explicitly rather than relying on the CMake toolchain to trigger the manifest
      # install. When vcpkg runs inside cmake --preset, its output lands in the middle of
      # that step's log next to a multi-kilobyte environment dump, and a failure there is
      # easy to miss: cmake carries on and only later complains that ECM is missing. As
      # its own step it is unambiguous, and --log-failed shows all of it.
      - name: Install vcpkg dependencies
        shell: bash
        run: |
          cmake/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          cmake/vcpkg/vcpkg.exe install --triplet "$VCPKG_TRIPLET" \
            --x-install-root "$GITHUB_WORKSPACE/vcpkg_installed"

      - name: Configure project
        run: |
          # Line continuations are backslashes: these steps run under bash, where a
          # backtick opens a command substitution and swallows the rest of the script.
          cmake --preset "$CMAKE_PRESET" \
            -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" \
            -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
            -D CMAKE_TOOLCHAIN_FILE=cmake/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Run build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Collect the launcher
        shell: bash
        run: |
          set -euo pipefail
          # The build produces three executables: the launcher plus _updater and _filelink
          # helpers. A loose glob picks the helper first, so match the main one exactly.
          exe=$(find build -name 'prismlauncher.exe' -not -path '*CMakeFiles*' | head -1)
          if [ -z "$exe" ]; then echo '::error::prismlauncher.exe not found'; exit 1; fi
          echo "Launcher: $exe"

          mkdir -p out
          cp "$exe" out/

          # Qt runtime: the DLLs live in $QT_ROOT_DIR/bin and the plugins -- including
          # platforms/qwindows.dll, without which the app aborts before it draws
          # anything -- in $QT_ROOT_DIR/plugins.
          if [ -d "$QT_ROOT_DIR/bin" ]; then
            find "$QT_ROOT_DIR/bin" -maxdepth 1 -name 'Qt6*.dll' -exec cp {} out/ \;
            if [ -d "$QT_ROOT_DIR/plugins" ]; then
              cp -r "$QT_ROOT_DIR/plugins" out/
            fi
          else
            echo "::warning::QT_ROOT_DIR/bin not found ($QT_ROOT_DIR)"
          fi

          # vcpkg's libraries are DLLs too; without them the launcher will not start.
          if [ -d build/vcpkg_installed ]; then
            find build/vcpkg_installed -path '*/bin/*.dll' -exec cp {} out/ \; 2>/dev/null || true
          fi

          echo "--- collected ---"
          ls -1 out | head -30
          echo "--- qwindows plugin present? ---"
          ls out/plugins/platforms/qwindows.dll 2>/dev/null || ls out/plugins/platforms/ 2>/dev/null || echo "MISSING"

      - name: Upload the launcher
        uses: actions/upload-artifact@v4
        with:
          name: prismlauncher-hypermine-windows
          path: out/
          retention-days: 14
